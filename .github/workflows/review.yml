# Revisor independente dos PRs para a main: um Claude que não fez o trabalho lê o PR e comenta com um veredito, usando
# os mesmos critérios das QAs (.claude/agents/qa.md para código, docs/design/qa.md para arte) e as regras do AGENTS.md.
# Não aprova nem faz merge: só comenta. Roda com a assinatura do Lucas (segredo CLAUDE_CODE_OAUTH_TOKEN, gerado com
# `claude setup-token`), sem chave de API. Instruções do revisor: .github/review-instructions.md.
name: Revisão

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Número do PR para revisar de novo
        required: true

# Um push novo no PR cancela a revisão do anterior (economiza a cota do plano).
concurrency:
  group: review-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    name: Revisão do Claude
    # Rascunhos não são revisados; PR de fork não tem acesso ao segredo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sem o token, avisa e para
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Falta o segredo CLAUDE_CODE_OAUTH_TOKEN (veja docs/orchestration.md, Revisor dos PRs)."
            exit 1
          fi

      - name: Revisão
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Repositório: ${{ github.repository }}. PR: #${{ github.event.pull_request.number || github.event.inputs.pr }}.
            Leia e siga .github/review-instructions.md à risca. Escreva em português.
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"

# A versão web (#39): depois do CI verde num push na main (ou à mão), exporta o preset Web (sem threads: roda em
# qualquer hospedagem estática, sem os cabeçalhos COOP/COEP), confere no Chromium que ela abre e passa pela Estação e
# por uma luta (tools/web_perf.mjs), e guarda o build como artefato. A publicação no GitHub Pages só acontece com a
# variável do repositório PUBLISH_WEB = true (Settings > Secrets and variables > Actions > Variables) e o Pages ligado
# com a fonte "GitHub Actions": o endereço fica público, decisão do Lucas.
name: Versão web

on:
  workflow_run:
    workflows: [Testes]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_ZIP: Godot_v4.7.2-stable_linux.x86_64.zip
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  build:
    name: Exportar a web
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Cache da Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Baixar a Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o ~/godot/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${GODOT_ZIP}"
          echo "${GODOT_SHA512}  $HOME/godot/godot.zip" | sha512sum -c -
          unzip -q ~/godot/godot.zip -d ~/godot
          rm ~/godot/godot.zip
          mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot

      # Só o modelo da web (~10 MB), lido de dentro do pacote de 1,3 GB por intervalos de bytes.
      - name: Cache do modelo da web
        id: template-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-web-template-${{ env.GODOT_VERSION }}

      - name: Baixar o modelo da web
        if: steps.template-cache.outputs.cache-hit != 'true'
        run: python3 tools/fetch_web_template.py "$GODOT_VERSION"

      - name: Cache da importação
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', 'project.godot') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-

      - name: Importar e exportar
        run: |
          ~/godot/godot --headless --path . --import
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          du -sh build/web
          ls -la build/web

      # A prova de que a web abre: o roteiro de desempenho (--perf) no Chromium sem placa (SwiftShader), na qualidade
      # Baixa. Sem placa é lento (a Estação leva uns 3 minutos): o tempo em ms daqui não vale como medida.
      - name: Abrir no navegador
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.56.1
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          cp tools/web_perf.mjs /tmp/pw/web_perf.mjs
          node /tmp/pw/web_perf.mjs --dir="$PWD/build/web" --only=title,station,street,combat --levels=0 --timeout=2400 | tee web-perf.log

      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            build/web
            web-perf.log
          retention-days: 7

      - name: Preparar o Pages
        if: vars.PUBLISH_WEB == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    if: vars.PUBLISH_WEB == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
